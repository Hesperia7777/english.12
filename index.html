<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>115學年第一學期英文期中考</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--pr:#3b6ef5;--ok:#1f9d55;--bad:#d64545;--bd:#dde3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121620;--card:#1c2230;--tx:#eef1f8;--mu:#97a1b8;--pr:#6b93ff;--ok:#43c47c;--bad:#ff7070;--bd:#2c3447}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif;min-height:100vh}
.w{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.t{flex:1 1 30%;min-width:0;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;cursor:pointer}
.t.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.bar{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin:8px 2px}
.face{min-height:200px;border-radius:16px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:24px;line-height:1.5;cursor:pointer;user-select:none;transition:transform .35s}
.face.b{background:var(--pr);color:#fff;border-color:var(--pr)}
.face small{display:block;font-size:13px;opacity:.7;margin-top:10px}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer;flex:1}
.btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.r{background:var(--bad);color:#fff;border-color:var(--bad)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;font-size:20px;line-height:1.7;margin-bottom:12px}
input{width:100%;padding:13px;font-size:18px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
.fb{min-height:26px;font-weight:600;margin:6px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;line-height:2;font-size:16px}
.slot{display:inline-block;min-width:96px;min-height:34px;padding:2px 10px;border:2px dashed var(--mu);border-radius:8px;text-align:center;vertical-align:middle;cursor:pointer;line-height:30px;font-weight:600}
.slot.f{border-style:solid;border-color:var(--pr)}.slot.ok{border-color:var(--ok);color:var(--ok)}.slot.bad{border-color:var(--bad);color:var(--bad)}
.pool{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bd)}
.chip{padding:9px 14px;background:var(--pr);color:#fff;border-radius:20px;touch-action:none;cursor:grab;user-select:none;font-weight:600}
.chip.sel{outline:3px solid var(--ok)}
.ghost{position:fixed;pointer-events:none;z-index:9;opacity:.85;transform:translate(-50%,-50%)}
.ex{display:block;color:var(--mu);font-size:14px;line-height:1.5}.opt{cursor:pointer;font-size:18px}.opt.ok{border-color:var(--ok);color:var(--ok);font-weight:600}.opt.bad{border-color:var(--bad);color:var(--bad)}.pic{position:relative;container-type:inline-size;border-radius:12px;overflow:hidden;border:1px solid var(--bd);margin-bottom:10px}.pic img{width:100%;height:auto;display:block}.bk{position:absolute;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px dashed #6b7488;border-radius:4px;font-size:var(--f,2.8cqw);line-height:1.1;text-align:center;overflow:hidden;font-weight:700;cursor:pointer;color:#1d2433;box-sizing:border-box}.bk.q0{color:#9aa3b5}.bk.ok{background:#d6f5e0;border:1.5px solid #1f9d55;color:#157a41}.bk.bad{background:#fde0e0;border:1.5px solid #d64545;color:#b02a2a}.bk.act{border:2px solid #3b6ef5;box-shadow:0 0 0 2px rgba(59,110,245,.35)}.pw{overflow-x:auto;margin-bottom:10px}.pw .pic{margin-bottom:0}.pool{max-height:38vh;overflow:auto}.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.opts .opt{flex:1 1 120px;text-align:center;margin-bottom:0}.bk input.bi{width:100%;height:100%;border:0;background:transparent;text-align:center;font:inherit;color:inherit;padding:0;margin:0;outline:none;border-radius:0}.end{text-align:center;padding:30px 10px;font-size:20px}
</style></head><body><div class="w"><h1>115學年第一學期英文期中考</h1><div id="app"></div></div>

const O=["acc","act","pic3","pic4","acc2","cat","cat2","vb","acc3","act3","art2","pic1","pic2"];
const $=s=>document.getElementById(s),sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const S={d:"acc",m:"flip",rev:0};
const nz=s=>{s=s.toLowerCase().trim().replace(/[.!?,]/g,"");return/^(ø|0|o|x|none|-|無)$/.test(s)?"ø":s},st=s=>s.replace(/^(a|an|the) /,"");
const chk=(it,x)=>{x=nz(x);return[it[1],...(it[2]||[])].map(nz).some(c=>c==x||(c.length>3&&st(c)==st(x)))};
const items=()=>D[S.d].i;
function start(w){if(D[S.d].img){S.p={v:[],rv:{},act:0,sel:null,c:0,mo:{},ch:D[S.d].o?sh(D[S.d].o):AR};render();return}S.o=sh(w||items().map((_,k)=>k));S.wr=[];S.i=0;S.f=0;S.ok=0;S.bad=0;S.fb="";S.dn=0;S.opt=null;S.pk=null;if(S.m=="drag")setG();render()}
function setG(){const ids=sh(items().map((_,k)=>k)).slice(0,6),d=D[S.d];let v=d.reuse?[...new Set(ids.map(k=>items()[k][1]))]:ids.map(k=>items()[k][1]);S.g={ids,s:{},sel:null,c:0,ch:sh(v).map((x,k)=>({id:k,v:x}))}}
const cur=()=>items()[S.o[S.i]];
function nav(){return`<select class="t" style="width:100%;margin-bottom:10px;font-size:16px" onchange="S.d=this.value;start()">${O.map(k=>`<option value="${k}" ${k==S.d?"selected":""}>${D[k].n}</option>`).join("")}</select><div class="row">${[["flip","🃏 翻牌"],["mc","✅ 選擇"],["drag","👆 拖移"],["type","⌨️ 打字"]].map(([k,n])=>`<button class="t ${k==S.m?"on":""}" style="flex:1 1 20%;padding:10px 2px" onclick="S.m='${k}';start()">${n}</button>`).join("")}</div>`}
function render(){let h=nav();if(D[S.d].img)h+=vPic();else if(S.m=="flip")h+=vFlip();else if(S.m=="type")h+=vType();else if(S.m=="mc")h+=vMC();else h+=vDrag();const y=scrollY,o=document.querySelector(".pw"),sx=o?o.scrollLeft:0;$("app").innerHTML=h;const o2=document.querySelector(".pw");if(o2)o2.scrollLeft=sx;scrollTo(0,y);const e=$("in");if(e)e.focus({preventScroll:true})}

const AR=["a","an","the","Ø"];
function vPic(){const d=D[S.d],P=S.p,m=S.m;let ok=0;
const bx=d.b.map((b,i)=>{const v=P.v[i];let t="",c="";
if(m=="flip"){if(P.rv[i]){t=d.a[i];c="ok"}else{t="?";c="q0"}}
else if(v!=null){t=v;if(m!="drag"||P.c)c=pok(v,i)?"ok":"bad"}
if(c=="ok")ok++;if(m!="flip"&&m!="drag"&&i==P.act)c+=" act";
return`<div class="bk ${c}" data-slot="${i}" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" onclick="bk(${i})">${m=="type"&&i==P.act?`<input id="in" class="bi" autocomplete="off" autocapitalize="off" value="${(v||"").replace(/"/g,"&quot;")}" onclick="event.stopPropagation()" onkeydown="if(event.key=='Enter')pty()">`:t}</div>`}).join("");
let ctl="";
if(m=="flip")ctl=`<div class="bar"><span>點空格翻牌</span></div><div class="row"><button class="btn" onclick="rvAll(1)">全部顯示</button><button class="btn" onclick="rvAll(0)">全部隱藏</button></div>`;
else if(m=="mc")ctl=`<div class="bar"><span>第 ${P.act+1} 格　✅ ${ok} / ${d.b.length}</span></div><div class="opts">${mo().map((x,k)=>`<div class="item opt" onclick="pk(${k})">${String.fromCharCode(65+k)}. ${x}</div>`).join("")}</div>${pbtn()}`;
else if(m=="type")ctl=`<div class="bar"><span>第 ${P.act+1} 格　✅ ${ok} / ${d.b.length}</span><span>直接在藍框內輸入，Enter 確認</span></div><div class="row">${d.o?"":`<button class="btn" onclick="$('in').value+='Ø';$('in').focus()">Ø</button>`}<button class="btn p" onclick="pty()">確定</button></div>${pbtn()}`;
else ctl=`<div class="bar"><span>拖到空格，或先點選項再點空格</span>${P.c?`<span>✅ ${ok} / ${d.b.length}</span>`:""}</div><div class="row"><button class="btn p" onclick="S.p.c=1;render()">檢查</button><button class="btn" onclick="start()">重置</button></div><div class="pool">${P.ch.map((x,k)=>d.o&&Object.values(P.v).includes(x)?"":`<span class="chip ${P.sel===k?"sel":""}" data-c="${k}">${x}</span>`).join("")}</div>`;
return`<div class="pw"><div class="pic" style="${d.mw?"min-width:"+d.mw+"px;":""}--f:${d.f||"2.8cqw"}"><img src="${d.img}" alt="" width="${d.w}" height="${d.h}">${bx}</div></div>${ctl}`}
const pbtn=()=>`<div class="row" style="margin-top:8px"><button class="btn r" onclick="redo()">重做錯的</button><button class="btn" onclick="start()">全部重來</button></div>`;
const pok=(v,i)=>{const f=t=>nz(t).replace(/^(a|an|the) /,""),a=D[S.d].a[i];return nz(v)==nz(a)||f(v)==f(a)};
function mo(){const d=D[S.d],P=S.p;if(!d.o)return AR;const a=d.a[P.act];return P.mo[P.act]||(P.mo[P.act]=sh([a,...sh(d.o.filter(x=>x!=a)).slice(0,3)]))}
function bk(i){const P=S.p;if(S.m=="flip"){P.rv[i]=!P.rv[i];flipBox(i);return}else if(S.m=="drag"){if(P.c)return;if(P.sel!=null){P.v[i]=P.ch[P.sel];P.sel=null}else delete P.v[i]}else P.act=i;render()}
function ppu(i,k){if(S.p.c)return;S.p.v[i]=S.p.ch[k];S.p.sel=null;render()}
function nxt(){const P=S.p,n=D[S.d].b.length;for(let j=1;j<=n;j++){const x=(P.act+j)%n;if(P.v[x]==null){P.act=x;return}}}
function pk(k){S.p.v[S.p.act]=mo()[k];nxt();render()}
function pty(){const v=$("in").value.trim(),n=D[S.d].b.length;if(!v){S.p.act=(S.p.act+1)%n;render();return}S.p.v[S.p.act]=v;nxt();render()}
function flipBox(i){const P=S.p,e=document.querySelector('[data-slot="'+i+'"]');if(!e)return;if(P.rv[i]){e.textContent=D[S.d].a[i];e.className="bk ok"}else{e.textContent="?";e.className="bk q0"}}
function rvAll(x){D[S.d].b.forEach((_,i)=>{S.p.rv[i]=!!x;flipBox(i)})}
function redo(){const P=S.p,d=D[S.d];d.b.forEach((_,i)=>{if(P.v[i]!=null&&!pok(P.v[i],i))delete P.v[i]});P.act=Math.max(0,d.b.findIndex((_,i)=>P.v[i]==null));render()}
function endv(){const w=S.m=="mc"&&S.wr&&S.wr.length;return`<div class="end">${w?"再接再厲！":"🎉 完成！"}<br>答對 ${S.ok} ／ 答錯 ${S.bad}<br><br><div class="row">${w?`<button class="btn r" onclick="start([${S.wr}])">錯誤練習（${S.wr.length}題）</button>`:""}<button class="btn p" onclick="start()">再試一次</button></div></div>`}
const mcC=()=>{const it=cur();return S.rev&&(S.d=="acc"||S.d=="act")?it[0]:it[1]};
function vMC(){if(S.i>=S.o.length)return endv();const it=cur(),R=S.rev&&(S.d=="acc"||S.d=="act"),q=R?it[1]:it[0],c=mcC();
if(!S.opt){const pool=[...new Set(items().map(x=>R?x[0]:x[1]))],AR=["a","an","the","Ø"];S.opt=pool.every(x=>AR.includes(x))?AR:sh([c,...sh(pool.filter(x=>x!=c)).slice(0,3)])}
const done=S.pk!=null;
return`<div class="bar"><span>${S.i+1} / ${S.o.length}　✅${S.ok} ❌${S.bad}</span>${S.d=="acc"||S.d=="act"?`<span style="cursor:pointer" onclick="S.rev=!S.rev;S.opt=null;S.pk=null;render()">⇄ ${R?"英→中":"中→英"}</span>`:""}</div>
<div class="q">${q}</div><div class="opts">${S.opt.map((x,k)=>`<div class="item opt ${done?(x==c?"ok":k==S.pk?"bad":""):""}" onclick="pick(${k})">${String.fromCharCode(65+k)}. ${x}</div>`).join("")}</div>
${done?`<div class="row" style="margin-top:8px"><button class="btn p" onclick="S.i++;S.opt=null;S.pk=null;render()">下一題</button></div>`:""}`}
function pick(k){if(S.pk!=null)return;S.pk=k;if(S.opt[k]==mcC())S.ok++;else{S.bad++;S.wr.push(S.o[S.i])}render()}
function vFlip(){if(S.i>=S.o.length)return`<div class="end">🎉 全部會了！<br><br><button class="btn p" onclick="start()">再來一次</button></div>`;
const it=cur(),fill=(t,a)=>t.replace("___","【"+a+"】");let f=S.rev?it[1]:it[0],b=S.rev?fill(it[0],it[1]):it[1];if(!S.rev&&it[0].includes("___")){b=fill(it[0],it[1])}
return`<div class="bar"><span>${S.i+1} / ${S.o.length}</span><span style="cursor:pointer" onclick="S.rev=!S.rev;S.f=0;render()">⇄ 切換正反面</span></div>
<div class="face ${S.f?"b":""}" onclick="S.f=!S.f;render()">${S.f?b+(it[3]?`<small>${it[3].replace("___","【"+it[1]+"】")}</small>`:""):f}${S.f?"":"<small>點一下翻面</small>"}</div>
<div class="row" style="margin-top:12px"><button class="btn r" onclick="S.o.push(S.o[S.i]);S.i++;S.f=0;render()">不熟</button><button class="btn g" onclick="S.i++;S.f=0;render()">會了</button></div>`}
function vType(){if(S.i>=S.o.length)return endv();const it=cur(),art=D[S.d].reuse;
return`<div class="bar"><span>${S.i+1} / ${S.o.length}</span><span>✅${S.ok} ❌${S.bad}</span></div><div class="q">${it[0]}${it[3]?`<small class="ex" style="margin-top:8px;font-size:16px">${it[3]}</small>`:""}</div>
<input id="in" autocomplete="off" autocapitalize="off" placeholder="${art?"輸入 a / an / the / Ø":"輸入答案"}" onkeydown="if(event.key=='Enter')go()" ${S.done?"disabled":""}>
<div class="row">${art?`<button class="btn" onclick="$('in').value+='Ø'">Ø</button>`:""}<button class="btn p" onclick="go()">${S.done?"下一題":"檢查"}</button></div><div class="fb ${S.cl||""}">${S.fb}</div>`}
function go(){if(S.done){S.done=0;S.fb="";S.i++;render();return}const it=cur(),v=$("in").value;if(!v.trim())return;
if(chk(it,v)){S.ok++;S.cl="ok";S.fb="✔ 正確！"}else{S.bad++;S.cl="bad";S.fb="✘ 正確答案："+it[1]}S.done=1;render();$("in").value=v}
function vDrag(){const g=S.g,d=D[S.d],used=Object.values(g.s);let sc=0;
const rows=g.ids.map((k,r)=>{const it=items()[k],c=g.s[r],v=c!=null?g.ch.find(x=>x.id==c).v:"",cl=g.c&&c!=null?(v==it[1]?"ok":"bad"):"";if(cl=="ok")sc++;
const sl=`<span class="slot ${c!=null?"f":""} ${cl}" data-slot="${r}" onclick="sc(${r})">${v||"　"}</span>`;
return`<div class="item">${it[0].includes("___")?it[0].replace("___",sl):it[0]+" → "+sl+(it[3]?`<small class="ex">${it[3]}</small>`:"")}${g.c&&cl=="bad"?` <small class="bad">（${it[1]}）</small>`:""}</div>`}).join("");
const pool=g.ch.filter(x=>d.reuse||!used.includes(x.id)).map(x=>`<span class="chip ${g.sel==x.id?"sel":""}" data-c="${x.id}">${x.v}</span>`).join("");
return`<div class="bar"><span>把下方選項拖到空格（也可先點選項再點空格）</span>${g.c?`<span>${sc}/${g.ids.length}</span>`:""}</div>${rows}
<div class="row"><button class="btn p" onclick="S.g.c=1;render()">檢查</button><button class="btn" onclick="setG();render()">換一組</button></div><div class="pool">${pool}</div>`}
function put(r,c){const g=S.g;if(g.c)return;if(!D[S.d].reuse)for(const k in g.s)if(g.s[k]==c)delete g.s[k];g.s[r]=c;g.sel=null;render()}
function sc(r){const g=S.g;if(g.c)return;if(g.sel!=null)put(r,g.sel);else{delete g.s[r];render()}}
let gh=null,dg=null;
document.addEventListener("pointerdown",e=>{const c=e.target.closest(".chip");if(!c)return;dg={id:+c.dataset.c,x:e.clientX,y:e.clientY,mv:0,t:c.textContent}});
document.addEventListener("pointermove",e=>{if(!dg)return;if(!dg.mv&&Math.hypot(e.clientX-dg.x,e.clientY-dg.y)>6){dg.mv=1;gh=document.createElement("div");gh.className="chip ghost";gh.textContent=dg.t;document.body.appendChild(gh)}
if(gh){gh.style.left=e.clientX+"px";gh.style.top=e.clientY+"px"}});
document.addEventListener("pointerup",e=>{if(!dg)return;const d=dg;dg=null;if(gh){gh.remove();gh=null}
if(!d.mv){if(D[S.d].img)S.p.sel=S.p.sel===d.id?null:d.id;else S.g.sel=S.g.sel==d.id?null:d.id;render();return}
const s=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-slot]");if(s){if(D[S.d].img)ppu(+s.dataset.slot,d.id);else put(+s.dataset.slot,d.id)}});
document.addEventListener("pointercancel",()=>{if(gh)gh.remove();gh=null;dg=null});
document.addEventListener("keydown",e=>{if(e.key!="Enter"||/^(INPUT|BUTTON)$/.test(e.target.tagName))return;const d=D[S.d];
if(d.img){const P=S.p,n=d.b.length;if(S.m=="flip"){const j=d.b.findIndex((_,i)=>!P.rv[i]);if(j>=0){P.rv[j]=1;flipBox(j)}}else if(S.m=="mc"||S.m=="type"){P.act=(P.act+1)%n;render()}return}
if(S.m=="type"){if(S.done)go();return}if(S.i>=S.o.length)return;
if(S.m=="flip"){if(!S.f)S.f=1;else{S.i++;S.f=0}render()}else if(S.m=="mc"&&S.pk!=null){S.i++;S.opt=null;S.pk=null;render()}});
start();
